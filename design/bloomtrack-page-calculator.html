<style>

    --cream:#FBF6EC; --paper:#FFFDF8; --ink:#3B3226; --ink-soft:#6E6355;

    --lavender:#C6B7DC; --gold:#E3B54F; --gold-deep:#B8862A; --line:#E7DFCF;

  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);
    background-image:radial-gradient(circle at 10% 4%, rgba(231,175,174,0.10), transparent 40%),
      radial-gradient(circle at 94% 92%, rgba(198,183,220,0.12), transparent 40%);
    font-family:'Tajawal',sans-serif;color:var(--ink);padding:28px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  .brand{font-family:'Markazi Text',serif;font-weight:700;font-size:28px;color:var(--rose-deep);margin-bottom:4px;}
  .brand span{color:var(--sage-deep);}
  .subtitle{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .field{flex:1;min-width:120px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .field select, .field input{
    width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--cream);font-family:'Tajawal';font-size:14.5px;color:var(--ink);
  }

  .result{
    margin-top:18px;background:linear-gradient(90deg, rgba(159,184,151,0.14), rgba(159,184,151,0.03));
    border:1px dashed var(--sage-deep);border-radius:16px;padding:18px 20px;
  }
  .result .big{font-family:'Markazi Text',serif;font-size:38px;font-weight:700;color:var(--sage-deep);}
  .result .lbl{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
  .result .sub{font-size:13px;color:var(--ink-soft);margin-top:6px;}

  .bar-track{background:var(--cream);border:1px solid var(--line);border-radius:8px;height:14px;overflow:hidden;margin-top:14px;}
  .bar-fill{background:var(--rose-deep);height:100%;border-radius:8px 0 0 8px;transition:.2s;}

  .note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:22px;}
  .err{color:var(--rose-deep);font-size:13px;margin-top:10px;}
</style>
</head>

function calc(){
  const surah = document.getElementById('surahSel').value;
  const from = parseInt(document.getElementById('fromAyah').value);
  const to = parseInt(document.getElementById('toAyah').value);
  const errBox = document.getElementById('errBox');
  const arr = pageMap[surah];
  errBox.textContent = '';

  if(!arr || isNaN(from) || isNaN(to) || from < 1 || to > arr.length || from > to){
    errBox.textContent = 'يُرجى التأكد من رقمي الآيات (تحتوي السورة على ' + (arr ? arr.length : '؟') + ' آية)';
    document.getElementById('pagesOut').textContent = '—';
    document.getElementById('rangeOut').textContent = '';
    document.getElementById('barFill').style.width = '0%';
    return;
  }

  let totalFrac = 0;
  let minPage = Infinity, maxPage = 0;
  for(let a = from; a <= to; a++){
    const [frac, pStart, pEnd] = arr[a-1];
    totalFrac += frac;
    if(pStart < minPage) minPage = pStart;
    if(pEnd > maxPage) maxPage = pEnd;
  }
  totalFrac = Math.round(totalFrac*1000)/1000;
  document.getElementById('pagesOut').textContent = totalFrac + ' صفحة';
  document.getElementById('rangeOut').textContent = 'من صفحة ' + minPage + ' إلى صفحة ' + maxPage + ' — سورة ' + surahNames[surah] + ' (آية ' + from + ' إلى ' + to + ')';
  const pct = Math.min(100, (totalFrac % 1 === 0 ? 100 : (totalFrac - Math.floor(totalFrac))*100));
  document.getElementById('barFill').style.width = (totalFrac>=1? 100 : pct) + '%';
}
